services:
  backend:
    image: swipl
    working_dir: /app
    volumes:
      - ./backend:/app:ro
    entrypoint: ["swipl"] # the swipl image already has this; stated for clarity
    command: ["-g", "use_module(server), start(8080), thread_get_message(_)"]
    # Not published on the host: reachable only through the frontend proxy.
    expose:
      - "8080"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    ports:
      - "8000:80"
    depends_on:
      - backend

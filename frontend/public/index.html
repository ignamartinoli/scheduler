<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetabler — valid class schedules</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Spline+Sans:wght@400;600&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- htmx >= 2 required: v1.x groups repeated field names, destroying the
       document order the /schedules/fragment DCG parser relies on. -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
</head>
<body>

<header class="masthead">
  <h1>Timetabler</h1>
  <p>One section per subject, zero overlaps. Prolog does the rest.</p>
</header>

<main>
  <form hx-post="/schedules/fragment"
        hx-target="#results"
        hx-swap="innerHTML"
        hx-indicator="#working">

    <div id="subjects"
         hx-get="/blank/subject"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML"></div>

    <div class="actions">
      <button type="button" class="ghost"
              hx-get="/blank/subject"
              hx-target="#subjects"
              hx-swap="beforeend">
        + Add subject
      </button>
      <button type="button" class="ghost" id="load-subjects"
              aria-expanded="false" aria-controls="subject-picker"
              _="on click
                   toggle .open on #subject-picker
                   then set my @aria-expanded to (#subject-picker matches .open)">
        Load subjects
      </button>
      <button type="submit" class="primary">Generate schedules</button>
      <span id="working" class="working">solving…</span>
    </div>
  </form>

  <div id="subject-picker" class="picker">
    <div class="picker-clip">
      <form class="picker-box"
            hx-post="/subjects/form"
            hx-target="#subjects"
            hx-swap="innerHTML"
            _="on change
                 set n to the length of <#picker-list input:checked/>
                 then put n into #picker-count
               on htmx:afterRequest
                 remove .open from #subject-picker
                 then set #load-subjects's @aria-expanded to 'false'">
        <div class="picker-head">
          <span aria-live="polite"><b id="picker-count">0</b> selected</span>
          <span class="picker-actions">
            <button type="submit" class="ghost small">Load selected</button>
            <button type="button" class="x" title="Collapse"
                    _="on click
                         remove .open from #subject-picker
                         then set #load-subjects's @aria-expanded to 'false'">×</button>
          </span>
        </div>
        <ul id="picker-list" class="picker-list"
            hx-get="/subjects/fragment"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"></ul>
      </form>
    </div>
  </div>

  <section id="results" aria-live="polite"></section>
</main>

</body>
</html>
